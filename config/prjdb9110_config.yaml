# PRJDB9110 HT-SELEX run config
# This keeps your default config untouched and points the pipeline at
# the round-by-round counts generated from downloaded FASTQ files.

target:
  input_type: "fasta"
  # Demo target only. Replace this path with the target used in your experiment.
  input_value: "data/sample_targets.fasta"
  name: "DEMO_ONLY_replace_with_experimental_target"

library:
  length_min: 15
  length_max: 100
  gc_min: 0.40
  gc_max: 0.75
  max_homopolymer: 4
  min_total_count: 5

selex:
  counts_file: "data/PRJDB9110/prjdb9110_round_counts.csv"
  round_prefix: "round_"

structure:
  temperature: 37.0

scoring:
  pseudocount: 1.0
  vectorized_metrics: false
  diversity_kmer_size: 3
  growth_weights:
    fold_change: 0.85
    trend: 0.15

filtering:
  top_n: 100
  min_log2_enrichment: 0.0

output:
  format: "both"
  directory: "output/prjdb9110"
  generate_plots: false
  verbose: true
